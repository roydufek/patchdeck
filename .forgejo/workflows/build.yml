# Patchdeck CI: builds the prod image, scans it, pushes to the Forgejo registry.
# Triggered on every push to main; also invokable manually via workflow_dispatch.
#
# Runner: instance-level Forgejo runner with the `docker` label resolving to
# alpine:latest, force_pull: true, host docker socket mounted into the job
# container. Build tools install per-run; the scanners run as --pull=always images,
# so every run gets the latest patched versions.
#
# Secrets used:
#   REGISTRY_TOKEN — Forgejo PAT with package R/W, stored at repo level.
#                    Used by `docker login` to authenticate against the registry.
#                    (Shared value, reused across repos.)
# Auto-provided:
#   actions/checkout uses Forgejo's runtime workflow token; no manual secret needed.

name: build-and-push

on:
  push:
    branches: [main]
    # Skip CI when the only changes don't affect the built image: compose files
    # (runtime-only, not baked in), env example, docs, gitignore. Image-relevant
    # paths (Dockerfile, api/**, entrypoint.sh, .forgejo/**) still build.
    paths-ignore:
      - 'docker-compose.yml'
      - 'docker-compose.ghcr.yml'
      - '.env.example'
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: docker
    steps:
      - name: install tools
        run: |
          # nodejs is required by actions/checkout (a JavaScript action) — bare
          # alpine doesn't ship it. docker-cli-buildx adds the BuildKit plugin so
          # `docker buildx build` works (legacy `docker build` is deprecated).
          # The scanners are NOT installed here: they run as aquasec/trivy + anchore/grype images
          # (--pull=always) in the gate steps, so a GitHub outage can't block CI (2026-11-07).
          apk add --no-cache docker-cli docker-cli-buildx git curl jq bash ca-certificates nodejs

      - name: checkout
        uses: actions/checkout@v4

      - name: login to forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forgejo.devbox.roydufek.com -u roydufek --password-stdin

      - name: extract version
        id: version
        run: |
          # Single source of truth for the version is the AppVersion default in
          # config.go (envOr("PATCHDECK_VERSION", "X.Y.Z")). Tag the build so the
          # registry UI shows readable vX.Y.Z entries plus a traceable short SHA.
          APP_VERSION=$(awk -F'"' '/PATCHDECK_VERSION/{print $4; exit}' api/internal/config/config.go)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building image with tags: v${APP_VERSION}, ${SHORT_SHA}, latest"

      - name: build image
        run: |
          # buildx --load uses BuildKit and loads the result into the host docker
          # image store so the trivy/grype scans + push can reference it by tag.
          docker buildx build --load \
            -t forgejo.devbox.roydufek.com/roydufek/patchdeck:v${{ steps.version.outputs.app_version }} \
            -t forgejo.devbox.roydufek.com/roydufek/patchdeck:${{ steps.version.outputs.short_sha }} \
            -t forgejo.devbox.roydufek.com/roydufek/patchdeck:latest \
            .

      # Waivers: .trivyignore = dated, reasoned, ≤30-day waivers only (hub standard § Scanner waivers).
      # Validates them, drops expired ones, and writes the active set for BOTH scanners. No file → no waivers.
      - name: scanner waivers
        run: |
          set -eu
          src=.trivyignore
          today=$(date -u +%Y-%m-%d)
          max=$(date -u -d "@$(( $(date -u +%s) + 30 * 86400 ))" +%Y-%m-%d)
          : > /tmp/trivy-waivers; ids=""; bad=0
          if [ -f "$src" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|'#'*) continue ;; esac
              id=$(printf '%s\n' "$line" | awk '{print $1}')
              exp=$(printf '%s\n' "$line" | sed -n 's/.*exp:\([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\).*/\1/p')
              reason=$(printf '%s\n' "$line" | sed -n 's/^[^#]*#[[:space:]]*\(..*\)$/\1/p')
              if [ -z "$exp" ] || [ -z "$reason" ]; then echo "WAIVER INVALID (needs exp:YYYY-MM-DD and '# reason'): $line"; bad=1; continue; fi
              if expr "$exp" \> "$max" >/dev/null; then echo "WAIVER TOO LONG (max 30 days, until $max): $line"; bad=1; continue; fi
              if expr "$exp" \< "$today" >/dev/null; then echo "waiver EXPIRED $exp - no longer applied (fix it or renew deliberately): $id"; continue; fi
              echo "waiver active until $exp: $id - $reason"
              echo "$id" >> /tmp/trivy-waivers; ids="$ids $id"
            done < "$src"
          fi
          if [ -n "$ids" ]; then
            echo "ignore:" > /tmp/grype-waivers.yaml
            for id in $ids; do printf '  - vulnerability: %s\n' "$id" >> /tmp/grype-waivers.yaml; done
          else
            echo "ignore: []" > /tmp/grype-waivers.yaml
          fi
          [ "$bad" -eq 0 ] || { echo "fix .trivyignore (standards/app-build-reference.md § Scanner waivers)"; exit 1; }

      # ── Security gates: fail the build only on FIXABLE High/Critical CVEs.
      # --ignore-unfixed / --only-fixed: don't block on CVEs with no upstream fix
      # (an OS base can accrete unfixable HIGH/CRITICAL in packages the app never
      # runs). Anything with a fix still fails the gate — that's the actionable
      # pressure that keeps the image at zero fixable HIGH/CRITICAL.
      # Each scanner runs in its own throwaway container on the host's docker (--pull=always = latest
      # program + a fresh DB, no cache). The waiver files go in with `docker cp`: a `-v /tmp/...` bind
      # would resolve on the devbox HOST, not in this job container. The scanner container doesn't get
      # the job's env, so Forgejo's GITHUB_TOKEN can't reach Trivy (the 2026-11-03 ghcr DENIED).
      - name: trivy scan (gate — fixable HIGH/CRITICAL)
        run: |
          C=$(docker create --pull=always --quiet -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --ignorefile /trivy-waivers --exit-code 1 \
            forgejo.devbox.roydufek.com/roydufek/patchdeck:v${{ steps.version.outputs.app_version }})
          docker cp /tmp/trivy-waivers "$C:/trivy-waivers"
          rc=0; docker start -a "$C" || rc=$?; docker rm -v "$C" >/dev/null; exit $rc

      - name: grype scan (gate — fixable HIGH/CRITICAL)
        run: |
          C=$(docker create --pull=always --quiet -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:latest \
            --only-fixed --fail-on high -c /grype-waivers.yaml \
            forgejo.devbox.roydufek.com/roydufek/patchdeck:v${{ steps.version.outputs.app_version }})
          docker cp /tmp/grype-waivers.yaml "$C:/grype-waivers.yaml"
          rc=0; docker start -a "$C" || rc=$?; docker rm -v "$C" >/dev/null; exit $rc

      # Non-gating visibility pass: prints EVERYTHING (incl. unfixable + lower
      # severities) so any backlog stays visible in the CI log without blocking.
      - name: trivy scan (report — all findings, non-gating)
        run: |
          docker run --rm --pull=always --quiet -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 \
            forgejo.devbox.roydufek.com/roydufek/patchdeck:v${{ steps.version.outputs.app_version }}

      - name: push image
        run: docker push --all-tags forgejo.devbox.roydufek.com/roydufek/patchdeck
